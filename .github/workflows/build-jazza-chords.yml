name: Build Jazza Chords

on:
  push:
    paths: [ "JazzaChords/**", ".github/workflows/build-jazza-chords.yml" ]
  pull_request:
    paths: [ "JazzaChords/**", ".github/workflows/build-jazza-chords.yml" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S JazzaChords -B JazzaChords/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build JazzaChords/build --config Release --parallel 4

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - JazzaChords/build/JazzaChords_artefacts/Release/VST3/"Jazza Chords.vst3"
          codesign --force --deep --sign - JazzaChords/build/JazzaChords_artefacts/Release/AU/"Jazza Chords.component"
          codesign --force --deep --sign - JazzaChords/build/JazzaChords_artefacts/Release/Standalone/"Jazza Chords.app"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JazzaChords-${{ matrix.name }}
          path: |
            JazzaChords/build/JazzaChords_artefacts/Release/VST3
            JazzaChords/build/JazzaChords_artefacts/Release/AU
            JazzaChords/build/JazzaChords_artefacts/Release/Standalone
          if-no-files-found: error
